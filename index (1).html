async function sync(first){if(!user)return;st="Menyinkronkan...";ev();
 try{var r=await pull(),L=window.D;

  }else if((L.rev||0)<r.rev){adopt(r)}

 catch(e){st="Gagal sinkron: "+(e.code||e.message)}
